# cp docker-compose.example.yml docker-compose.yml 후 경로를 맞춘다 (README "설치 (도커)" 참고).
# ★★★ 도커 설치는 절대로 권장하지 않습니다 - README "설치 (서버에 직접)"를 쓰세요. 이 파일은 참고용 ★★★
# 중요: 저장 경로·감시할 마운트는 BookOasis 컨테이너와 "같은 경로"로 마운트한다.
#       (받은 파일 경로를 BookOasis 보관함 경로와 그대로 비교하기 때문)
services:
  bookoasis_assistant:
    build: .
    container_name: bookoasis_assistant
    restart: unless-stopped
    stop_grace_period: 60s
    # env_file은 쓰지 않는다: 설정은 마운트한 .env를 이 프로그램이 직접 읽고 쓴다
    # (여기 environment에 적은 키는 .env보다 우선하므로 화면에서 바꿀 값은 적지 말 것)
    environment:
      DATA_DIR: /data
      WEB_HOST: 0.0.0.0          # 외부에 열므로 계정이 없으면 .env에 WEB_USER/WEB_PASSWORD 필수
      TZ: Asia/Seoul             # 기다무 충전 시각·새벽 시간대 계산이 이 시간대 기준
    # 받은 파일을 호스트 사용자 소유로 만들려면 (기본은 root). /data, .env, 저장 경로에 이 사용자가 쓸 수 있어야 함
    # user: "1000:1000"
    volumes:
      - ./data:/data             # 기록·설정(settings.json)·쿠키·로그 - 지우면 처음부터
      - ./.env:/app/.env         # 화면에서 저장하면 이 파일에 쓴다 (먼저 cp env.example .env)
      # ── 웹툰 다운로더 ──
      # 저장 경로: BookOasis 보관함과 같은 경로로. .env의 WTM_DOWNLOAD_ROOT 등에는 "컨테이너 안" 경로를 적는다
      - /mnt/gds2:/mnt/gds2:rslave          # 예: WTM_DOWNLOAD_ROOT=/mnt/gds2/webtoon/naver
      # 임시 작업 폴더: 반드시 로컬 디스크 (저장 경로가 rclone 마운트일 때 특히)
      - /opt/wtm_tmp:/wtm_tmp               # .env에 WTM_TEMP_DOWNLOAD_ROOT=/wtm_tmp
      # ── 드라이브 변경 감시 (GDW_ENABLED=true일 때만) ──
      - /opt/rclone:/config/rclone          # rclone.conf는 파일이 아니라 디렉터리째. .env에 RCLONE_CONFIG=/config/rclone/rclone.conf
    ports:
      - "5931:5931"
    # 드라이브 변경 감시가 호스트의 rclone rc(127.0.0.1:5572)나 BookOasis(127.0.0.1:5930)에 붙어야 하면
    # 가장 간단한 방법은 호스트 네트워크 (이때 ports:는 지운다)
    # network_mode: host
    # 같은 도커 네트워크에 BookOasis가 있으면 .env에 BOOKOASIS_URL=http://bookoasis:5930
