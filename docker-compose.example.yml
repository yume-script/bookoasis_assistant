# cp docker-compose.example.yml docker-compose.yml 후 경로를 맞춘다.
# 중요: 감시할 마운트는 BookOasis 컨테이너와 "같은 경로"로 마운트한다.
#       (변경 경로를 BookOasis 보관함 경로와 그대로 비교하기 때문)
services:
  gdrive_watch:
    build: .
    container_name: gdrive_watch
    restart: unless-stopped
    stop_grace_period: 60s
    # env_file은 쓰지 않는다: 설정은 마운트한 .env를 이 프로그램이 직접 읽고 쓴다
    # (여기 environment에 적은 키는 .env보다 우선하므로 화면에서 바꿀 값은 적지 말 것)
    # .env에 RCLONE_CONFIG=/config/rclone/rclone.conf, WEB_PASSWORD=… 를 넣는다
    environment:
      DATA_DIR: /data
      WEB_HOST: 0.0.0.0          # 외부에 열므로 .env에 WEB_PASSWORD 필수
      TZ: Asia/Seoul
    volumes:
      - ./data:/data
      - ./.env:/app/.env         # 화면에서 실행 환경을 저장하면 이 파일에 쓴다 (먼저 cp env.example .env)
      - /opt/rclone:/config/rclone   # rclone.conf는 파일이 아니라 디렉터리째
      - /mnt/gds2:/mnt/gds2:rslave   # BookOasis와 같은 경로
      # 웹툰 다운로더(WTM_ENABLED=true): 저장 경로도 BookOasis와 같은 경로로, 임시 작업 폴더는 로컬 디스크
      # - /mnt/webtoon:/mnt/webtoon
      # - /opt/wtm_tmp:/wtm_tmp       # .env에 WTM_TEMP_DOWNLOAD_ROOT=/wtm_tmp
    ports:
      - "5931:5931"
    # BookOasis가 같은 도커 네트워크에 있으면 BOOKOASIS_URL=http://bookoasis:5930 처럼 쓴다
