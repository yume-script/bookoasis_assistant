<!doctype html>
<html lang="ko" data-theme="dark" data-accent="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141517">
<title>텔레그램 자동 올리기</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script>
  // 테마를 그리기 전에 정해 둔다 (깜빡임 방지, shell.js [테마]에서 고른 값)
  (function () { try { var t = JSON.parse(localStorage.getItem('bo_theme') || '{}') || {};
    var d = JSON.parse(localStorage.getItem('bo_theme_default') || '{}') || {};
    document.documentElement.setAttribute('data-theme', t.theme || d.theme || 'dark');
    document.documentElement.setAttribute('data-accent', t.accent || d.accent || 'amber'); } catch (e) { /* 저장소를 못 쓰는 브라우저 */ } })();
</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="tgup/style.css">
</head>
<body data-module="tgup">
<main class="gdw-page">
<div class="tgup" id="tgup-app">
  <div>
    <h1><i class="fa-solid fa-cloud-arrow-up"></i> 텔레그램 자동 올리기</h1>
    <p class="lead">Plex 라이브러리나 rclone 드라이브에 새로 들어온 동영상을 내 텔레그램 계정으로 채널에 올립니다
      (YMPlayer의 설정 &gt; 자동 올리기와 같은 기능).</p>
  </div>
  <nav class="tgup-tabs" role="tablist">
    <button type="button" role="tab" class="is-on" data-tab="status"><i class="fa-solid fa-list-check"></i> 진행 상태</button>
    <button type="button" role="tab" data-tab="rules"><i class="fa-solid fa-sliders"></i> 규칙</button>
    <button type="button" role="tab" data-tab="account"><i class="fa-brands fa-telegram"></i> 텔레그램 계정</button>
  </nav>
  <section data-pane="status"></section>
  <section data-pane="rules" hidden></section>
  <section data-pane="account" hidden></section>
</div>
</main>
<script src="shell.js"></script>
<script src="tgup/script.js"></script>
</body>
</html>
