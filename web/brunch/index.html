<!doctype html>
<html lang="ko" data-theme="dark" data-accent="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141517">
<!-- 아이폰·아이패드 [홈 화면에 추가]: 앱처럼 전체 화면으로 (위쪽 상태 막대 밑은 theme.css가 safe-area만큼 비운다) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOA">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>브런치 EPUB 받기</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script>
  // 테마를 그리기 전에 정해 둔다 (깜빡임 방지, shell.js [테마]에서 고른 값)
  (function () { try { var t = JSON.parse(localStorage.getItem('bo_theme') || '{}') || {};
    var d = JSON.parse(localStorage.getItem('bo_theme_default') || '{}') || {};
    document.documentElement.setAttribute('data-theme', t.theme || d.theme || 'dark');
    document.documentElement.setAttribute('data-accent', t.accent || d.accent || 'amber'); } catch (e) { /* 저장소를 못 쓰는 브라우저 */ } })();
</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="brunch/style.css">
</head>
<body data-module="brunch">
<main class="gdw-page">
<div class="brunch" id="brunch-app">
  <div>
    <h1><i class="fa-solid fa-book-bookmark"></i> 브런치 EPUB 받기</h1>
    <p class="lead">브런치(brunch.co.kr)의 브런치북을 EPUB 한 권으로 받습니다. 회차마다 장이 되고 목차·표지·본문 그림이 함께 들어갑니다.
      저장 폴더가 BookOasis 보관함 안이면 받은 뒤 바로 스캔합니다.</p>
  </div>
  <nav class="brunch-tabs" role="tablist">
    <button type="button" role="tab" class="is-on" data-tab="browse"><i class="fa-solid fa-table-cells"></i> 연재 목록</button>
    <button type="button" role="tab" data-tab="url"><i class="fa-solid fa-link"></i> 주소로 받기</button>
    <button type="button" role="tab" data-tab="history"><i class="fa-solid fa-clock-rotate-left"></i> 받은 목록</button>
    <button type="button" role="tab" data-tab="settings"><i class="fa-solid fa-gear"></i> 설정</button>
  </nav>
  <div class="br-jobs" hidden></div>
  <section data-pane="browse"></section>
  <section data-pane="url" hidden></section>
  <section data-pane="history" hidden></section>
  <section data-pane="settings" hidden></section>
</div>
</main>
<script src="shell.js"></script>
<script src="brunch/script.js"></script>
</body>
</html>
